name: CI & Build Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Verification & Test Job
  # ============================================================================
  check:
    name: Check & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      - name: Run Cargo Check
        run: cargo check --verbose

      - name: Run Cargo Test
        run: cargo test --verbose

  # ============================================================================
  # 2. Standalone Static Binary Builds (Linux x86_64 & aarch64)
  # ============================================================================
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            use_cross: false
          - target: aarch64-unknown-linux-musl
            arch: arm64
            use_cross: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (for x86_64)
        if: ${{ !matrix.use_cross }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (for aarch64)
        if: ${{ matrix.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-

      - name: Build Standalone Musl Binary (Native x86_64)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Standalone Musl Binary (Cross aarch64)
        if: ${{ matrix.use_cross }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Package Binary Archive
        run: |
          mkdir -p release-pkg
          cp target/${{ matrix.target }}/release/wireguard-ui release-pkg/
          cp README.md release-pkg/
          cp TODO.md release-pkg/ 2>/dev/null || true
          tar -czf wireguard-ui-linux-${{ matrix.arch }}.tar.gz -C release-pkg .
          sha256sum wireguard-ui-linux-${{ matrix.arch }}.tar.gz > wireguard-ui-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-ui-linux-${{ matrix.arch }}
          path: |
            wireguard-ui-linux-${{ matrix.arch }}.tar.gz
            wireguard-ui-linux-${{ matrix.arch }}.tar.gz.sha256
          retention-days: 14

  # ============================================================================
  # 3. Publish GitHub Release (On Tag 'v*' or Manual Trigger)
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download amd64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: wireguard-ui-linux-amd64
          path: dist

      - name: Download arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: wireguard-ui-linux-arm64
          path: dist

      - name: Generate Combined Checksum
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  # ============================================================================
  # 4. Multi-Arch Docker Build & Publish to GHCR
  # ============================================================================
  docker-publish:
    name: Build & Push Docker Container
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lower case image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and Push Docker Image (Multi-Arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
